<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://use.typekit.net/jlu6tvf.css" />

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        background: none;
      }

      #subCount {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .sub {
        font-family: 'uppercut-angle', sans-serif;
        font-weight: 400;
        font-style: normal;
        color: white;
        font-size: 70px;
        text-align: center;
      }
    </style>

    <title>Lord Savith's Subscriber Count</title>
  </head>
  <body>
    <div id="subCount"><p class="sub"></p></div>

    <script>
      const key = '';
      const user = '';
      const text = document.querySelector('#subCount .sub');

      function GetSubscribers() {
        fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${user}&key=${key}`)
          .then(response => response.json())
          .then(data => {
            text.innerHTML = data.items[0].statistics.subscriberCount;
          });
      }

      GetSubscribers();
    </script>
  </body>
</html>
